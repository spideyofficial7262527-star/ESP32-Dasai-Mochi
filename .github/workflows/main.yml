name: Build Mochi Firmware

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'platformio.ini'
      - '.github/workflows/compile.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Locate PlatformIO project
        shell: bash
        run: |
          CONFIG=$(find . -name platformio.ini \
            -not -path './.git/*' | head -n 1)

          if [ -z "$CONFIG" ]; then
            echo "ERROR: platformio.ini not found!"
            find . -maxdepth 4 -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$CONFIG")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - name: Compile Mochi
        run: pio run -d "$PROJECT_DIR" -e esp32-s3-devkitc-1

      - name: Collect firmware
        shell: bash
        run: |
          mkdir -p firmware

          find "$PROJECT_DIR/.pio/build/esp32-s3-devkitc-1" \
            -maxdepth 1 -type f -name '*.bin' \
            -exec cp {} firmware/ \;

          ls -lh firmware

      - name: Upload BIN files
        uses: actions/upload-artifact@v4
        with:
          name: Mochi-ESP32-Firmware
          path: firmware/*.bin
          if-no-files-found: error
